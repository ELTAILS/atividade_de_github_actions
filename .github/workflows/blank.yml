name: Primeiro action

on:
  push:

  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Executar teste
        run: echo "Hello world"

      - name: Resumo
        run: |
          echo "## ✅ Workflow executado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Código baixado com sucesso" >> $GITHUB_STEP_SUMMARY
          echo "- Teste executado: Hello world" >> $GITHUB_STEP_SUMMARY
          echo "- Sistema utilizado: Ubuntu" >> $GITHUB_STEP_SUMMARY
